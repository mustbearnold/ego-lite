<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ego lite</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #e5e7eb;
        background: #111827;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
      }

      #toolbar {
        align-items: center;
        background: #111827;
        border-bottom: 1px solid #374151;
        display: flex;
        gap: 8px;
        height: 52px;
        padding: 8px 12px;
      }

      button {
        background: #1f2937;
        border: 1px solid #4b5563;
        border-radius: 6px;
        color: #e5e7eb;
        cursor: pointer;
        font-size: 16px;
        height: 34px;
        min-width: 34px;
      }

      button:hover {
        background: #374151;
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
      }

      form {
        display: flex;
        flex: 1;
        gap: 8px;
      }

      input {
        background: #1f2937;
        border: 1px solid #4b5563;
        border-radius: 6px;
        color: #f9fafb;
        flex: 1;
        font:
          14px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        height: 34px;
        min-width: 0;
        padding: 0 10px;
      }

      select {
        background: #1f2937;
        border: 1px solid #4b5563;
        border-radius: 6px;
        color: #e5e7eb;
        font-size: 13px;
        height: 34px;
        max-width: 260px;
        min-width: 150px;
        padding: 0 8px;
      }

      #group-menu {
        position: relative;
      }

      #bookmark-menu {
        position: relative;
      }

      #bookmark-menu summary {
        background: #1f2937;
        border: 1px solid #4b5563;
        border-radius: 6px;
        color: #e5e7eb;
        cursor: pointer;
        font-size: 13px;
        height: 34px;
        list-style: none;
        padding: 8px 10px;
        white-space: nowrap;
      }

      #bookmark-menu summary::-webkit-details-marker {
        display: none;
      }

      #group-menu summary {
        background: #1f2937;
        border: 1px solid #4b5563;
        border-radius: 6px;
        color: #e5e7eb;
        cursor: pointer;
        font-size: 13px;
        height: 34px;
        list-style: none;
        padding: 8px 10px;
        white-space: nowrap;
      }

      #group-menu summary::-webkit-details-marker {
        display: none;
      }

      #space-menu {
        position: relative;
      }

      #space-menu summary {
        background: #1f2937;
        border: 1px solid #4b5563;
        border-radius: 6px;
        color: #e5e7eb;
        cursor: pointer;
        font-size: 13px;
        height: 34px;
        list-style: none;
        padding: 8px 10px;
        white-space: nowrap;
      }

      #space-menu summary::-webkit-details-marker {
        display: none;
      }

      #space-list {
        background: #1f2937;
        border: 1px solid #4b5563;
        border-radius: 6px;
        display: grid;
        gap: 6px;
        min-width: 280px;
        padding: 6px;
        position: absolute;
        right: 0;
        top: 40px;
        z-index: 10;
      }

      .space-row {
        align-items: center;
        display: flex;
        gap: 6px;
      }

      .space-row > span {
        flex: 1;
        font-size: 12px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .space-row button {
        font-size: 11px;
        height: 28px;
        min-width: 0;
        padding: 0 7px;
      }

      #group-list {
        background: #1f2937;
        border: 1px solid #4b5563;
        border-radius: 6px;
        display: grid;
        gap: 4px;
        min-width: 220px;
        padding: 6px;
        position: absolute;
        right: 0;
        top: 40px;
        z-index: 10;
      }

      #group-list button {
        font-size: 12px;
        overflow: hidden;
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
        width: 100%;
      }

      #bookmark-list {
        background: #1f2937;
        border: 1px solid #4b5563;
        border-radius: 6px;
        display: grid;
        gap: 4px;
        min-width: 260px;
        max-height: min(520px, calc(100vh - 72px));
        overflow: auto;
        padding: 6px;
        position: absolute;
        right: 0;
        top: 40px;
        z-index: 10;
      }

      #bookmark-list button {
        font-size: 12px;
        overflow: hidden;
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
        width: 100%;
      }

      #extension-menu {
        position: relative;
      }

      #extension-menu summary {
        background: #1f2937;
        border: 1px solid #4b5563;
        border-radius: 6px;
        color: #e5e7eb;
        cursor: pointer;
        font-size: 13px;
        height: 34px;
        list-style: none;
        padding: 8px 10px;
        white-space: nowrap;
      }

      #extension-menu summary::-webkit-details-marker {
        display: none;
      }

      #extension-list {
        background: #1f2937;
        border: 1px solid #4b5563;
        border-radius: 6px;
        display: grid;
        gap: 6px;
        min-width: 280px;
        max-height: min(520px, calc(100vh - 72px));
        overflow: auto;
        padding: 6px;
        position: absolute;
        right: 0;
        top: 40px;
        z-index: 10;
      }

      .extension-row {
        align-items: center;
        display: flex;
        gap: 8px;
      }

      .extension-row > span {
        flex: 1;
        font-size: 12px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .extension-row input {
        flex: 0 0 auto;
        height: 16px;
        width: 16px;
      }

      #profile-menu {
        position: relative;
      }

      #profile-menu summary {
        background: #1f2937;
        border: 1px solid #4b5563;
        border-radius: 6px;
        color: #e5e7eb;
        cursor: pointer;
        font-size: 13px;
        height: 34px;
        list-style: none;
        padding: 8px 10px;
        white-space: nowrap;
      }

      #profile-menu summary::-webkit-details-marker {
        display: none;
      }

      #profile-list {
        background: #1f2937;
        border: 1px solid #4b5563;
        border-radius: 6px;
        display: grid;
        gap: 4px;
        min-width: 220px;
        padding: 6px;
        position: absolute;
        right: 0;
        top: 40px;
        z-index: 10;
      }

      #profile-list button {
        font-size: 12px;
        overflow: hidden;
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
        width: 100%;
      }

      #download-menu {
        position: relative;
      }

      #download-menu summary {
        background: #1f2937;
        border: 1px solid #4b5563;
        border-radius: 6px;
        color: #e5e7eb;
        cursor: pointer;
        font-size: 13px;
        height: 34px;
        list-style: none;
        padding: 8px 10px;
        white-space: nowrap;
      }

      #download-menu summary::-webkit-details-marker {
        display: none;
      }

      #download-list {
        background: #1f2937;
        border: 1px solid #4b5563;
        border-radius: 6px;
        display: grid;
        gap: 6px;
        min-width: 300px;
        max-height: min(520px, calc(100vh - 72px));
        overflow: auto;
        padding: 6px;
        position: absolute;
        right: 0;
        top: 40px;
        z-index: 10;
      }

      .download-row {
        align-items: center;
        display: flex;
        gap: 6px;
      }

      .download-row > span {
        flex: 1;
        font-size: 12px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .download-row button {
        font-size: 11px;
        height: 28px;
        min-width: 0;
        padding: 0 7px;
      }

      #status {
        color: #9ca3af;
        font-size: 12px;
        max-width: 240px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #control {
        border: 1px solid #4b5563;
        border-radius: 999px;
        color: #d1d5db;
        font-size: 11px;
        max-width: 110px;
        overflow: hidden;
        padding: 4px 8px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #control[data-ownership="agent"] {
        border-color: #2563eb;
        color: #bfdbfe;
      }

      #control[data-ownership="user"] {
        border-color: #059669;
        color: #a7f3d0;
      }

      #update {
        border: 1px solid #4b5563;
        border-radius: 999px;
        color: #d1d5db;
        font-size: 11px;
        max-width: 180px;
        overflow: hidden;
        padding: 4px 8px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #update[data-status="ready"] {
        border-color: #059669;
        color: #a7f3d0;
      }

      #update[data-status="downloading"] {
        border-color: #2563eb;
        color: #bfdbfe;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="back" type="button" title="Back">‹</button>
      <button id="forward" type="button" title="Forward">›</button>
      <button id="reload" type="button" title="Reload">↻</button>
      <button id="mute-tab" type="button" title="Mute tab" aria-label="Mute tab">
        Mute
      </button>
      <form id="address-form">
        <input
          id="address"
          aria-label="Address"
          autocomplete="url"
          spellcheck="false"
          value="about:blank"
        />
      </form>
      <button id="new-tab" type="button" title="New tab" aria-label="New tab">
        +
      </button>
      <button
        id="new-private-tab"
        type="button"
        title="New private tab"
        aria-label="New private tab"
      >
        Private
      </button>
      <button id="close-tab" type="button" title="Close tab" aria-label="Close tab">
        ×
      </button>
      <button id="import-data" type="button" title="Import browser data">
        Import
      </button>
      <details id="profile-menu" hidden>
        <summary>Profile</summary>
        <div id="profile-list" role="menu"></div>
      </details>
      <details id="bookmark-menu" hidden>
        <summary>Bookmarks</summary>
        <div id="bookmark-list" role="menu"></div>
      </details>
      <details id="extension-menu" hidden>
        <summary>Extensions</summary>
        <div id="extension-list" role="menu"></div>
      </details>
      <details id="download-menu" hidden>
        <summary>Downloads</summary>
        <div id="download-list" role="menu"></div>
      </details>
      <select id="tab-picker" aria-label="Open tab"></select>
      <details id="space-menu" hidden>
        <summary>Spaces</summary>
        <div id="space-list" role="menu"></div>
      </details>
      <details id="group-menu" hidden>
        <summary>Groups</summary>
        <div id="group-list" role="menu"></div>
      </details>
      <span id="control" aria-live="polite">Your tab</span>
      <span id="update" aria-live="polite" hidden></span>
      <span id="status">ready</span>
    </div>
    <script>
      const address = document.querySelector("#address");
      const status = document.querySelector("#status");
      const back = document.querySelector("#back");
      const forward = document.querySelector("#forward");
      const muteTab = document.querySelector("#mute-tab");
      const newTab = document.querySelector("#new-tab");
      const newPrivateTab = document.querySelector("#new-private-tab");
      const closeTab = document.querySelector("#close-tab");
      const importData = document.querySelector("#import-data");
      const profileMenu = document.querySelector("#profile-menu");
      const profileList = document.querySelector("#profile-list");
      const bookmarkMenu = document.querySelector("#bookmark-menu");
      const bookmarkList = document.querySelector("#bookmark-list");
      const extensionMenu = document.querySelector("#extension-menu");
      const extensionList = document.querySelector("#extension-list");
      const downloadMenu = document.querySelector("#download-menu");
      const downloadList = document.querySelector("#download-list");
      const tabPicker = document.querySelector("#tab-picker");
      const spaceMenu = document.querySelector("#space-menu");
      const spaceList = document.querySelector("#space-list");
      const groupMenu = document.querySelector("#group-menu");
      const groupList = document.querySelector("#group-list");
      const control = document.querySelector("#control");
      const update = document.querySelector("#update");

      function tabLabel(tab) {
        const space =
          tab.spaceId === null
            ? tab.private
              ? "Private tab"
              : "Your tab"
            : tab.spaceName || `Space ${tab.spaceId}`;
        const location = tab.title || tab.url || "New tab";
        return `${space} — ${location}`;
      }

      function applyProfiles(profiles = [], activeId = "default") {
        profileList.replaceChildren();
        profileMenu.hidden = profiles.length === 0;
        if (profiles.length === 0) return;
        const active = profiles.find((profile) => profile.id === activeId);
        profileMenu.querySelector("summary").textContent = `Profile · ${active?.name || activeId}`;
        for (const profile of profiles) {
          const button = document.createElement("button");
          button.type = "button";
          button.dataset.profileId = profile.id;
          button.textContent = `${profile.name}${profile.active ? " · active" : ""}`;
          button.disabled = Boolean(profile.active);
          button.setAttribute("aria-label", `Use profile: ${profile.name}`);
          button.addEventListener("click", async () => {
            try {
              await window.egoLite.switchProfile({ id: profile.id });
            } catch (error) {
              status.textContent = error.message;
            }
          });
          profileList.append(button);
        }
        const create = document.createElement("button");
        create.type = "button";
        create.textContent = "New profile…";
        create.setAttribute("aria-label", "Create new profile");
        create.addEventListener("click", async () => {
          const name = window.prompt("New profile name");
          if (!name?.trim()) return;
          try {
            await window.egoLite.createProfile({ name });
          } catch (error) {
            status.textContent = error.message;
          }
        });
        profileList.append(create);
      }

      function applyBookmarks(bookmarks = []) {
        bookmarkList.replaceChildren();
        bookmarkMenu.hidden = bookmarks.length === 0;
        for (const bookmark of bookmarks) {
          const button = document.createElement("button");
          button.type = "button";
          button.dataset.bookmarkUrl = bookmark.url;
          button.setAttribute(
            "aria-label",
            bookmark.folder ? `${bookmark.name} · ${bookmark.folder}` : bookmark.name,
          );
          button.title = bookmark.url;
          button.textContent = bookmark.folder
            ? `${bookmark.name} · ${bookmark.folder}`
            : bookmark.name;
          button.addEventListener("click", async () => {
            try {
              await window.egoLite.navigate(bookmark.url);
              bookmarkMenu.open = false;
            } catch (error) {
              status.textContent = error.message;
            }
          });
          bookmarkList.append(button);
        }
      }

      function applyExtensions(extensions = []) {
        extensionList.replaceChildren();
        extensionMenu.hidden = extensions.length === 0;
        for (const extension of extensions) {
          const row = document.createElement("label");
          row.className = "extension-row";
          row.dataset.extensionId = extension.id;
          const label = document.createElement("span");
          label.textContent = `${extension.name} · ${extension.version}${extension.error ? " · unavailable" : ""}`;
          label.title = extension.error || extension.name;
          const toggle = document.createElement("input");
          toggle.type = "checkbox";
          toggle.checked = Boolean(extension.enabled);
          toggle.disabled = Boolean(extension.error);
          toggle.setAttribute("aria-label", `${extension.name} enabled`);
          toggle.addEventListener("change", async () => {
            toggle.disabled = true;
            try {
              applyState(
                await window.egoLite.setExtension({
                  id: extension.id,
                  enabled: toggle.checked,
                }),
              );
            } catch (error) {
              toggle.checked = !toggle.checked;
              toggle.disabled = false;
              status.textContent = error.message;
            }
          });
          row.append(label, toggle);
          extensionList.append(row);
        }
      }

      function applySpaces(spaces = []) {
        spaceList.replaceChildren();
        spaceMenu.hidden = spaces.length === 0;
        for (const space of spaces) {
          const row = document.createElement("div");
          row.className = "space-row";
          row.dataset.spaceId = String(space.id);
          const label = document.createElement("span");
          label.textContent = `${space.name || `Space ${space.id}`} · ${space.ownership === "user" ? "user" : "agent"} · ${space.tabCount || 0} tab${space.tabCount === 1 ? "" : "s"}`;
          row.append(label);

          const ownership = document.createElement("button");
          ownership.type = "button";
          ownership.dataset.spaceAction = "ownership";
          ownership.setAttribute(
            "aria-label",
            `${space.ownership === "user" ? "Return control to agent" : "Take over Space"}: ${space.name || `Space ${space.id}`}`,
          );
          ownership.textContent = space.ownership === "user" ? "Return" : "Take over";
          ownership.addEventListener("click", async () => {
            try {
              applyState(
                await window.egoLite.setSpaceOwnership({
                  spaceId: space.id,
                  ownership: space.ownership === "user" ? "agent" : "user",
                }),
              );
            } catch (error) {
              status.textContent = error.message;
            }
          });
          row.append(ownership);

          const stop = document.createElement("button");
          stop.type = "button";
          stop.dataset.spaceAction = "stop";
          stop.setAttribute(
            "aria-label",
            `Stop Space: ${space.name || `Space ${space.id}`}`,
          );
          stop.textContent = "Stop";
          stop.addEventListener("click", async () => {
            try {
              applyState(await window.egoLite.stopSpace({ spaceId: space.id }));
            } catch (error) {
              status.textContent = error.message;
            }
          });
          row.append(stop);
          spaceList.append(row);
        }
      }

      function applyDownloads(downloads = []) {
        downloadList.replaceChildren();
        downloadMenu.hidden = downloads.length === 0;
        for (const download of downloads) {
          const row = document.createElement("div");
          row.className = "download-row";
          const label = document.createElement("span");
          const percent = download.percent == null ? "" : ` ${download.percent}%`;
          label.textContent = `${download.filename} · ${download.state}${percent}`;
          label.title = download.path || download.url || download.filename;
          row.append(label);
          if (download.state === "completed" && download.path) {
            const show = document.createElement("button");
            show.type = "button";
            show.textContent = "Show";
            show.setAttribute("aria-label", `Show downloaded file: ${download.filename}`);
            show.addEventListener("click", async () => {
              try {
                await window.egoLite.showDownload(download.id);
              } catch (error) {
                status.textContent = error.message;
              }
            });
            row.append(show);
          }
          downloadList.append(row);
        }
      }

      function applyTabs(tabs = []) {
        tabPicker.replaceChildren();
        const activeTab = tabs.find((tab) => tab.active);
        muteTab.disabled = !activeTab;
        muteTab.textContent = activeTab?.muted ? "Unmute" : "Mute";
        muteTab.title = activeTab?.muted ? "Unmute tab" : "Mute tab";
        muteTab.setAttribute(
          "aria-label",
          activeTab?.muted ? "Unmute tab" : "Mute tab",
        );
        const groups = new Map();
        for (const tab of tabs) {
          const option = document.createElement("option");
          option.value = tab.targetId;
          option.textContent = tabLabel(tab);
          option.selected = Boolean(tab.active);
          const group = tab.tabGroup;
          if (!group) {
            tabPicker.append(option);
            continue;
          }
          option.hidden = Boolean(group.collapsed && !tab.active);
          let groupEntry = groups.get(group.id);
          if (!groupEntry) {
            const groupOptions = document.createElement("optgroup");
            const suffix = group.collapsed ? " (collapsed)" : "";
            groupOptions.label = `${group.title || "Tab group"} · ${group.color || "grey"}${suffix}`;
            groupEntry = { element: groupOptions, data: group };
            groups.set(group.id, groupEntry);
            tabPicker.append(groupOptions);
          }
          groupEntry.element.append(option);
        }
        tabPicker.disabled = tabs.length < 2;
        groupList.replaceChildren();
        groupMenu.hidden = groups.size === 0;
        for (const { data: group } of groups.values()) {
          const button = document.createElement("button");
          button.type = "button";
          button.setAttribute("role", "menuitemcheckbox");
          button.setAttribute("aria-checked", String(!group.collapsed));
          button.setAttribute(
            "aria-label",
            `${group.title || "Tab group"} ${group.collapsed ? "collapsed" : "expanded"}`,
          );
          button.textContent = `${group.title || "Tab group"} · ${group.color || "grey"}${group.collapsed ? " (collapsed)" : ""}`;
          button.addEventListener("click", async () => {
            try {
              await window.egoLite.setTabGroup({
                id: group.id,
                collapsed: !group.collapsed,
              });
              applyState(await window.egoLite.getBrowserState());
            } catch (error) {
              status.textContent = error.message;
            }
          });
          groupList.append(button);
        }
      }

      function applyUpdateState(state = {}) {
        const status = state.status;
        if (status === "ready") {
          update.hidden = false;
          update.dataset.status = status;
          update.textContent = "Update ready · next launch";
        } else if (status === "downloading") {
          update.hidden = false;
          update.dataset.status = status;
          update.textContent = state.percent == null
            ? "Downloading update…"
            : `Downloading update ${state.percent}%`;
        } else {
          update.hidden = true;
          update.textContent = "";
          delete update.dataset.status;
        }
      }

      function applyState(state) {
        address.value = state.url || "about:blank";
        status.textContent = state.agentTaskState || state.title || "ego lite";
        const controlState = state.controlState || {
          ownership: "user",
          label: "Your tab",
        };
        control.textContent = controlState.label || "Your tab";
        control.dataset.ownership = controlState.ownership || "user";
        back.disabled = !state.canGoBack;
        forward.disabled = !state.canGoForward;
        applyProfiles(state.profiles, state.profileId);
        applyBookmarks(state.bookmarks);
        applyExtensions(state.extensions);
        applyDownloads(state.downloads);
        applySpaces(state.taskSpaces);
        applyUpdateState(state.updateState);
        applyTabs(state.tabs);
      }

      document
        .querySelector("#address-form")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          try {
            await window.egoLite.navigate(address.value);
          } catch (error) {
            status.textContent = error.message;
          }
        });
      back.addEventListener("click", () => window.egoLite.back());
      forward.addEventListener("click", () => window.egoLite.forward());
      newTab.addEventListener("click", async () => {
        try {
          applyTabs(await window.egoLite.newTab());
        } catch (error) {
          status.textContent = error.message;
        }
      });
      newPrivateTab.addEventListener("click", async () => {
        try {
          applyTabs(await window.egoLite.newPrivateTab());
        } catch (error) {
          status.textContent = error.message;
        }
      });
      closeTab.addEventListener("click", async () => {
        try {
          applyTabs(await window.egoLite.closeTab());
        } catch (error) {
          status.textContent = error.message;
        }
      });
      tabPicker.addEventListener("change", async () => {
        try {
          const tabs = await window.egoLite.activateTab(tabPicker.value);
          applyTabs(tabs);
        } catch (error) {
          status.textContent = error.message;
        }
      });
      document
        .querySelector("#reload")
        .addEventListener("click", () => window.egoLite.reload());
      muteTab.addEventListener("click", async () => {
        muteTab.disabled = true;
        try {
          applyState(await window.egoLite.toggleTabMute());
        } catch (error) {
          muteTab.disabled = false;
          status.textContent = error.message;
        }
      });
      importData.addEventListener("click", async () => {
        importData.disabled = true;
        status.textContent = "choose browser profile…";
        try {
          const result = await window.egoLite.importData();
          if (result?.cancelled) status.textContent = "import cancelled";
        } catch (error) {
          importData.disabled = false;
          status.textContent = error.message;
        }
      });
      window.egoLite.onImportStatus((value) => {
        if (value?.state === "restarting") status.textContent = "restarting…";
      });
      function focusAddress() {
        address.focus();
        address.select();
      }
      window.egoLite.onFocusAddress(focusAddress);
      window.addEventListener("keydown", (event) => {
        if (event.altKey || !(event.metaKey || event.ctrlKey)) return;
        const key = event.key.toLowerCase();
        if (event.shiftKey && key === "n") {
          event.preventDefault();
          newPrivateTab.click();
        } else if (key === "t") {
          event.preventDefault();
          newTab.click();
        } else if (key === "w") {
          event.preventDefault();
          closeTab.click();
        } else if (key === "l") {
          event.preventDefault();
          focusAddress();
        } else if (key === "r") {
          event.preventDefault();
          window.egoLite.reload();
        } else if (key === "[") {
          event.preventDefault();
          back.click();
        } else if (key === "]") {
          event.preventDefault();
          forward.click();
        }
      });
      window.egoLite.onBrowserState(applyState);
      window.egoLite.getBrowserState().then(applyState);
    </script>
  </body>
</html>
