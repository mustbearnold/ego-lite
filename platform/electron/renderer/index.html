  <body>
    <div id="toolbar">
      <button id="back" type="button" title="Back">‹</button>
      <button id="forward" type="button" title="Forward">›</button>
      <button id="reload" type="button" title="Reload">↻</button>
      <button id="mute-tab" type="button" title="Mute tab" aria-label="Mute tab">
        Mute
      </button>
      <form id="address-form">
        <input
          id="address"
          aria-label="Address"
          autocomplete="url"
          spellcheck="false"
          value="about:blank"
        />
      </form>
      <button id="bookmark-page" type="button" title="Bookmark page" aria-label="Bookmark page">
        ☆
      </button>
      <button id="new-tab" type="button" title="New tab" aria-label="New tab">
        +
      </button>
      <button
        id="new-private-tab"
        type="button"
        title="New private tab"
        aria-label="New private tab"
      >
        Private
      </button>
      <button id="close-tab" type="button" title="Close tab" aria-label="Close tab">
        ×
      </button>
      <button id="group-tab" type="button" title="Group tab" aria-label="Group tab">
        Group
      </button>
      <button id="import-data" type="button" title="Import browser data">
        Import
      </button>
      <details id="sync-menu">
        <summary>Sync</summary>
        <div id="sync-list" role="menu">
          <label class="sync-row">
            <span>Keep browser data up to date</span>
            <input id="sync-enabled" type="checkbox" />
          </label>
          <label class="sync-row">
            <span>Check every</span>
            <select id="sync-interval" aria-label="Browser sync interval">
              <option value="15">15 minutes</option>
              <option value="60">1 hour</option>
              <option value="360">6 hours</option>
              <option value="1440">1 day</option>
            </select>
          </label>
          <span id="sync-status" aria-live="polite">Browser sync is off</span>
          <button id="sync-source" type="button">Choose source…</button>
          <button id="sync-now" type="button">Sync now</button>
        </div>
      </details>
      <details id="profile-menu" hidden>
        <summary>Profile</summary>
        <div id="profile-list" role="menu"></div>
      </details>
      <details id="bookmark-menu" hidden>
        <summary>Bookmarks</summary>
        <div id="bookmark-list" role="menu"></div>
      </details>
      <details id="history-menu" hidden>
        <summary>History</summary>
        <div id="history-list" role="menu"></div>
      </details>
      <details id="reading-list-menu">
        <summary>Reading list</summary>
        <div id="reading-list-list" role="menu"></div>
      </details>
      <details id="extension-menu" hidden>
        <summary>Extensions</summary>
        <div id="extension-list" role="menu"></div>
      </details>
      <details id="download-menu" hidden>
        <summary>Downloads</summary>
        <div id="download-list" role="menu"></div>
      </details>
      <select id="tab-picker" aria-label="Open tab"></select>
      <details id="space-menu" hidden>
        <summary>Spaces</summary>
        <div id="space-list" role="menu"></div>
      </details>
      <details id="group-menu" hidden>
        <summary>Groups</summary>
        <div id="group-list" role="menu"></div>
      </details>
      <span id="control" aria-live="polite">Your tab</span>
      <span id="update" aria-live="polite" hidden></span>
      <span id="status">ready</span>
      <div id="find-bar" hidden role="search" aria-label="Find in page">
        <input id="find-input" aria-label="Find in page" autocomplete="off" spellcheck="false" />
        <span id="find-count" aria-live="polite"></span>
        <button id="find-previous" type="button" title="Previous match" aria-label="Previous match">↑</button>
        <button id="find-next" type="button" title="Next match" aria-label="Next match">↓</button>
        <button id="find-close" type="button" title="Close find bar" aria-label="Close find bar">×</button>
      </div>
    </div>
    <div id="tab-strip" role="tablist" aria-label="Tabs"></div>
    <script>
      const address = document.querySelector("#address");
      const status = document.querySelector("#status");
      const back = document.querySelector("#back");
      const forward = document.querySelector("#forward");
      const muteTab = document.querySelector("#mute-tab");
      const newTab = document.querySelector("#new-tab");
      const newPrivateTab = document.querySelector("#new-private-tab");
      const closeTab = document.querySelector("#close-tab");
      const groupTab = document.querySelector("#group-tab");
      const bookmarkPage = document.querySelector("#bookmark-page");
      const importData = document.querySelector("#import-data");
      const syncEnabled = document.querySelector("#sync-enabled");
      const syncInterval = document.querySelector("#sync-interval");
      const syncStatus = document.querySelector("#sync-status");
      const syncSource = document.querySelector("#sync-source");
      const syncNow = document.querySelector("#sync-now");
      const profileMenu = document.querySelector("#profile-menu");
      const profileList = document.querySelector("#profile-list");
      const bookmarkMenu = document.querySelector("#bookmark-menu");
      const bookmarkList = document.querySelector("#bookmark-list");
      const historyMenu = document.querySelector("#history-menu");
      const historyList = document.querySelector("#history-list");
      const readingListMenu = document.querySelector("#reading-list-menu");
      const readingListList = document.querySelector("#reading-list-list");
      const extensionMenu = document.querySelector("#extension-menu");
      const extensionList = document.querySelector("#extension-list");
      const downloadMenu = document.querySelector("#download-menu");
      const downloadList = document.querySelector("#download-list");
      const tabPicker = document.querySelector("#tab-picker");
      const tabStrip = document.querySelector("#tab-strip");
      const spaceMenu = document.querySelector("#space-menu");
      const spaceList = document.querySelector("#space-list");
      const groupMenu = document.querySelector("#group-menu");
      const groupList = document.querySelector("#group-list");
      const control = document.querySelector("#control");
      const update = document.querySelector("#update");
      const findBar = document.querySelector("#find-bar");
      const findInput = document.querySelector("#find-input");
      const findCount = document.querySelector("#find-count");
      const findPrevious = document.querySelector("#find-previous");
      const findNext = document.querySelector("#find-next");
      const findClose = document.querySelector("#find-close");
      let currentTabs = [];

      function tabLabel(tab) {
        const space =
          tab.spaceId === null
            ? tab.private
              ? "Private tab"
              : "Your tab"
            : tab.spaceName || `Space ${tab.spaceId}`;
        const location = tab.title || tab.url || "New tab";
        return `${space} — ${location}`;
      }

      function applyProfiles(profiles = [], activeId = "default") {
        profileList.replaceChildren();
        profileMenu.hidden = profiles.length === 0;
        if (profiles.length === 0) return;
        const active = profiles.find((profile) => profile.id === activeId);
        profileMenu.querySelector("summary").textContent = `Profile · ${active?.name || activeId}`;
        for (const profile of profiles) {
          const button = document.createElement("button");
          button.type = "button";

      function applySpaces(spaces = [], tabs = []) {
        spaceList.replaceChildren();

          row.className = "space-row";

          const taskState = space.taskState
            ? ` · ${space.taskState}`
            : " · idle";
          label.textContent = `${space.name || `Space ${space.id}`} · ${space.ownership === "user" ? "user" : "agent"} · ${space.tabCount || 0} tab${space.tabCount === 1 ? "" : "s"}${taskState}`;
          label.title = space.taskState || "idle";
          row.append(label);

          const spaceTabs = tabs.filter(
            (tab) => Number(tab.spaceId) === Number(space.id),
          );

          open.dataset.spaceAction = "open";

      function applyFindResult(result = {}) {
        if (result.cleared || !findInput.value) {
          findCount.textContent = "";

        if (!result.finalUpdate) {
          findCount.textContent = "Searching…";

        }

        findCount.textContent = matches
          ? `${Number(result.activeMatchOrdinal) || 0} of ${matches}`
          : "No matches";

      function renderTabStrip(tabs = []) {

          const label = tabLabel(tab);

          chip.dataset.targetId = tab.targetId;
          chip.dataset.active = String(Boolean(tab.active));
          if (tab.tabGroup?.color) {
            chip.dataset.groupColor = tab.tabGroup.color;
          }
          chip.hidden = Boolean(tab.tabGroup?.collapsed && !tab.active);

          const activate = document.createElement("button");
          activate.type = "button";
          activate.className = "tab-chip-main";
          activate.setAttribute("role", "tab");
          activate.setAttribute("aria-selected", String(Boolean(tab.active)));

          activate.textContent = label;
          activate.title = tab.url || label;
          activate.addEventListener("click", async () => {

      function applyTabs(tabs = []) {
        currentTabs = tabs;
        renderTabStrip(tabs);
        tabPicker.replaceChildren();
        const activeTab = tabs.find((tab) => tab.active);
        muteTab.disabled = !activeTab;
        muteTab.textContent = activeTab?.muted ? "Unmute" : "Mute";
        muteTab.title = activeTab?.muted ? "Unmute tab" : "Mute tab";
        muteTab.setAttribute(
          "aria-label",
          activeTab?.muted ? "Unmute tab" : "Mute tab",
        );
        const canGroup = Boolean(
          activeTab && activeTab.spaceId === null && !activeTab.private,
        );
        const isGrouped = Boolean(activeTab?.tabGroup);
        groupTab.disabled = !canGroup;
        groupTab.textContent = isGrouped ? "Ungroup" : "Group";
        groupTab.title = isGrouped ? "Remove tab from group" : "Group tab";
        groupTab.setAttribute(
          "aria-label",
          isGrouped ? "Remove tab from group" : "Group tab",
        );
        const groups = new Map();
        for (const tab of tabs) {
          const option = document.createElement("option");
          option.value = tab.targetId;
          option.textContent = tabLabel(tab);
          option.selected = Boolean(tab.active);
          const group = tab.tabGroup;
          if (!group) {
            tabPicker.append(option);
            continue;
          }
          option.hidden = Boolean(group.collapsed && !tab.active);
          let groupEntry = groups.get(group.id);
          if (!groupEntry) {
            const groupOptions = document.createElement("optgroup");
            const suffix = group.collapsed ? " (collapsed)" : "";
            groupOptions.label = `${group.title || "Tab group"} · ${group.color || "grey"}${suffix}`;
            groupEntry = { element: groupOptions, data: group };
            groups.set(group.id, groupEntry);
            tabPicker.append(groupOptions);
          }
          groupEntry.element.append(option);
        }
        tabPicker.disabled = tabs.length < 2;
        groupList.replaceChildren();
        groupMenu.hidden = groups.size === 0;
        for (const { data: group } of groups.values()) {
          const row = document.createElement("div");
          row.className = "group-row";
          const button = document.createElement("button");
          button.type = "button";
          button.dataset.groupAction = "collapse";
          button.setAttribute("role", "menuitemcheckbox");
          button.setAttribute("aria-checked", String(!group.collapsed));
          button.setAttribute(
            "aria-label",
            `${group.title || "Tab group"} ${group.collapsed ? "collapsed" : "expanded"}`,
          );
          button.textContent = `${group.title || "Tab group"} · ${group.color || "grey"}${group.collapsed ? " (collapsed)" : ""}`;
          button.addEventListener("click", async () => {
            try {
              await window.egoLite.setTabGroup({
                id: group.id,
                collapsed: !group.collapsed,
              });
              applyState(await window.egoLite.getBrowserState());
            } catch (error) {
              status.textContent = error.message;
            }
          });
          row.append(button);
          const add = document.createElement("button");
          add.type = "button";
          add.dataset.groupAction = "add-tab";
          add.textContent = "Add current tab";
          add.disabled = Boolean(
            !activeTab ||
              activeTab.spaceId !== null ||
              activeTab.private ||
              activeTab.tabGroup?.id === group.id,
          );
          add.setAttribute("aria-label", `Add current tab to ${group.title || "tab group"}`);
          add.addEventListener("click", async () => {
            try {
              applyTabs(
                await window.egoLite.setTabGroup({
                  targetId: activeTab.targetId,
                  groupId: group.id,
                }),
              );
            } catch (error) {
              status.textContent = error.message;
            }
          });
          row.append(add);
          groupList.append(row);
        }
      }

      function applyBrowserSync(sync = {}) {
        syncEnabled.checked = Boolean(sync.enabled);
        syncInterval.value = String(sync.intervalMinutes || 15);
        syncNow.disabled = sync.status === "syncing";
        syncSource.textContent = sync.sourceName
          ? `Source · ${sync.sourceName}`
          : "Choose source…";
        if (sync.status === "syncing") {
          syncStatus.textContent = "Syncing browser data…";
        } else if (sync.status === "error") {
          syncStatus.textContent = `Sync error · ${sync.message || "check failed"}`;
        } else if (sync.status === "ready") {
          syncStatus.textContent = `Synced ${sync.importedBookmarks || 0} bookmarks · ${sync.importedHistory || 0} history entries`;
        } else if (sync.enabled) {
          syncStatus.textContent = `On · every ${sync.intervalMinutes || 15} minutes`;
        } else {
          syncStatus.textContent = "Browser sync is off";
        }
      }

      function applyUpdateState(state = {}) {
        const status = state.status;
        if (status === "ready") {
          update.hidden = false;
          update.dataset.status = status;
          update.textContent = "Update ready · next launch";
        } else if (status === "downloading") {
          update.hidden = false;
          update.dataset.status = status;
          update.textContent = state.percent == null
            ? "Downloading update…"
            : `Downloading update ${state.percent}%`;
        } else {
          update.hidden = true;
          update.textContent = "";
          delete update.dataset.status;
        }
      }

      function applyState(state) {
        address.value = state.url || "about:blank";
        status.textContent = state.agentTaskState || state.title || "ego lite";
        const controlState = state.controlState || {
          ownership: "user",
          label: "Your tab",
        };
        control.textContent = controlState.label || "Your tab";
        control.dataset.ownership = controlState.ownership || "user";
        back.disabled = !state.canGoBack;
        forward.disabled = !state.canGoForward;
        bookmarkPage.disabled = !state.bookmarkCanToggle;
        bookmarkPage.textContent = state.bookmarked ? "★" : "☆";
        bookmarkPage.title = state.bookmarked
          ? "Remove bookmark"
          : "Bookmark page";
        bookmarkPage.setAttribute(
          "aria-label",
          state.bookmarked ? "Remove bookmark" : "Bookmark page",
        );
        applyProfiles(state.profiles, state.profileId);
        applyBookmarks(state.bookmarks);
        applyHistory(state.history);
        applyReadingList(state.readingList, state.readingListCanAdd);
        applyBrowserSync(state.browserSync);
        applyExtensions(state.extensions);
        applyDownloads(state.downloads);
        applySpaces(state.taskSpaces, state.tabs);
        applyUpdateState(state.updateState);
        applyTabs(state.tabs);
      }

      window.egoLite.onImportStatus((value) => {

      function focusAddress() {
        address.focus();
        address.select();
      }
      window.egoLite.onFocusAddress(focusAddress);
      window.egoLite.onFocusFind(openFind);
      window.egoLite.onFindResult(applyFindResult);
      findInput.addEventListener("input", () => moveFind(true));
      findInput.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          event.preventDefault();
          closeFind();
        } else if (event.key === "Enter") {
          event.preventDefault();
          moveFind(!event.shiftKey);
        }
      });
      findPrevious.addEventListener("click", () => moveFind(false));
      findNext.addEventListener("click", () => moveFind(true));
      findClose.addEventListener("click", closeFind);
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !findBar.hidden) {
          event.preventDefault();
          closeFind();
          return;
        }
        if (event.altKey || !(event.metaKey || event.ctrlKey)) return;
        const key = event.key.toLowerCase();
        if (event.shiftKey && key === "t") {
          event.preventDefault();
          window.egoLite.reopenClosedTab().then(applyTabs).catch((error) => {
            status.textContent = error.message;
          });
        } else if (event.shiftKey && key === "n") {
          event.preventDefault();
          newPrivateTab.click();
        } else if (key === "t") {
          event.preventDefault();
          newTab.click();
        } else if (key === "w") {
          event.preventDefault();
          closeTab.click();
        } else if (key === "l") {
          event.preventDefault();
          focusAddress();
        } else if (key === "f") {
          event.preventDefault();
          openFind();
        } else if (key === "r") {
          event.preventDefault();
          window.egoLite.reload();
        } else if (key === "[") {
          event.preventDefault();
          back.click();
        } else if (key === "]") {
          event.preventDefault();
          forward.click();
        }
      });
      window.egoLite.onBrowserState(applyState);
      window.egoLite.getBrowserState().then(applyState);
    </script>
  </body>
</html>
