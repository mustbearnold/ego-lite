<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ego lite</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #e5e7eb;
        background: #111827;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
      }

      #toolbar {
        align-items: center;
        background: #111827;
        border-bottom: 1px solid #374151;
        display: flex;
        gap: 8px;
        height: 52px;
        padding: 8px 12px;
      }

      button {
        background: #1f2937;
        border: 1px solid #4b5563;
        border-radius: 6px;
        color: #e5e7eb;
        cursor: pointer;
        font-size: 16px;
        height: 34px;
        min-width: 34px;
      }

      button:hover {
        background: #374151;
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
      }

      form {
        display: flex;
        flex: 1;
        gap: 8px;
      }

      input {
        background: #1f2937;
        border: 1px solid #4b5563;
        border-radius: 6px;
        color: #f9fafb;
        flex: 1;
        font:
          14px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        height: 34px;
        min-width: 0;
        padding: 0 10px;
      }

      select {
        background: #1f2937;
        border: 1px solid #4b5563;
        border-radius: 6px;
        color: #e5e7eb;
        font-size: 13px;
        height: 34px;
        max-width: 260px;
        min-width: 150px;
        padding: 0 8px;
      }

      #group-menu {
        position: relative;
      }

      #group-menu summary {
        background: #1f2937;
        border: 1px solid #4b5563;
        border-radius: 6px;
        color: #e5e7eb;
        cursor: pointer;
        font-size: 13px;
        height: 34px;
        list-style: none;
        padding: 8px 10px;
        white-space: nowrap;
      }

      #group-menu summary::-webkit-details-marker {
        display: none;
      }

      #group-list {
        background: #1f2937;
        border: 1px solid #4b5563;
        border-radius: 6px;
        display: grid;
        gap: 4px;
        min-width: 220px;
        padding: 6px;
        position: absolute;
        right: 0;
        top: 40px;
        z-index: 10;
      }

      #group-list button {
        font-size: 12px;
        overflow: hidden;
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
        width: 100%;
      }

      #status {
        color: #9ca3af;
        font-size: 12px;
        max-width: 240px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #control {
        border: 1px solid #4b5563;
        border-radius: 999px;
        color: #d1d5db;
        font-size: 11px;
        max-width: 110px;
        overflow: hidden;
        padding: 4px 8px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #control[data-ownership="agent"] {
        border-color: #2563eb;
        color: #bfdbfe;
      }

      #control[data-ownership="user"] {
        border-color: #059669;
        color: #a7f3d0;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="back" type="button" title="Back">‹</button>
      <button id="forward" type="button" title="Forward">›</button>
      <button id="reload" type="button" title="Reload">↻</button>
      <form id="address-form">
        <input
          id="address"
          aria-label="Address"
          autocomplete="url"
          spellcheck="false"
          value="about:blank"
        />
      </form>
      <button id="import-data" type="button" title="Import browser data">
        Import
      </button>
      <select id="tab-picker" aria-label="Open tab"></select>
      <details id="group-menu" hidden>
        <summary>Groups</summary>
        <div id="group-list" role="menu"></div>
      </details>
      <span id="control" aria-live="polite">Your tab</span>
      <span id="status">ready</span>
    </div>
    <script>
      const address = document.querySelector("#address");
      const status = document.querySelector("#status");
      const back = document.querySelector("#back");
      const forward = document.querySelector("#forward");
      const importData = document.querySelector("#import-data");
      const tabPicker = document.querySelector("#tab-picker");
      const groupMenu = document.querySelector("#group-menu");
      const groupList = document.querySelector("#group-list");
      const control = document.querySelector("#control");

      function tabLabel(tab) {
        const space =
          tab.spaceId === null
            ? "Your tab"
            : tab.spaceName || `Space ${tab.spaceId}`;
        const location = tab.title || tab.url || "New tab";
        return `${space} — ${location}`;
      }

      function applyTabs(tabs = []) {
        tabPicker.replaceChildren();
        const groups = new Map();
        for (const tab of tabs) {
          const option = document.createElement("option");
          option.value = tab.targetId;
          option.textContent = tabLabel(tab);
          option.selected = Boolean(tab.active);
          const group = tab.tabGroup;
          if (!group) {
            tabPicker.append(option);
            continue;
          }
          option.hidden = Boolean(group.collapsed && !tab.active);
          let groupEntry = groups.get(group.id);
          if (!groupEntry) {
            const groupOptions = document.createElement("optgroup");
            const suffix = group.collapsed ? " (collapsed)" : "";
            groupOptions.label = `${group.title || "Tab group"} · ${group.color || "grey"}${suffix}`;
            groupEntry = { element: groupOptions, data: group };
            groups.set(group.id, groupEntry);
            tabPicker.append(groupOptions);
          }
          groupEntry.element.append(option);
        }
        tabPicker.disabled = tabs.length < 2;
        groupList.replaceChildren();
        groupMenu.hidden = groups.size === 0;
        for (const { data: group } of groups.values()) {
          const button = document.createElement("button");
          button.type = "button";
          button.setAttribute("role", "menuitemcheckbox");
          button.setAttribute("aria-checked", String(!group.collapsed));
          button.setAttribute(
            "aria-label",
            `${group.title || "Tab group"} ${group.collapsed ? "collapsed" : "expanded"}`,
          );
          button.textContent = `${group.title || "Tab group"} · ${group.color || "grey"}${group.collapsed ? " (collapsed)" : ""}`;
          button.addEventListener("click", async () => {
            try {
              await window.egoLite.setTabGroup({
                id: group.id,
                collapsed: !group.collapsed,
              });
              applyState(await window.egoLite.getBrowserState());
            } catch (error) {
              status.textContent = error.message;
            }
          });
          groupList.append(button);
        }
      }

      function applyState(state) {
        address.value = state.url || "about:blank";
        status.textContent = state.agentTaskState || state.title || "ego lite";
        const controlState = state.controlState || {
          ownership: "user",
          label: "Your tab",
        };
        control.textContent = controlState.label || "Your tab";
        control.dataset.ownership = controlState.ownership || "user";
        back.disabled = !state.canGoBack;
        forward.disabled = !state.canGoForward;
        applyTabs(state.tabs);
      }

      document
        .querySelector("#address-form")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          try {
            await window.egoLite.navigate(address.value);
          } catch (error) {
            status.textContent = error.message;
          }
        });
      back.addEventListener("click", () => window.egoLite.back());
      forward.addEventListener("click", () => window.egoLite.forward());
      tabPicker.addEventListener("change", async () => {
        try {
          const tabs = await window.egoLite.activateTab(tabPicker.value);
          applyTabs(tabs);
        } catch (error) {
          status.textContent = error.message;
        }
      });
      document
        .querySelector("#reload")
        .addEventListener("click", () => window.egoLite.reload());
      importData.addEventListener("click", async () => {
        importData.disabled = true;
        status.textContent = "choose browser profile…";
        try {
          const result = await window.egoLite.importData();
          if (result?.cancelled) status.textContent = "import cancelled";
        } catch (error) {
          importData.disabled = false;
          status.textContent = error.message;
        }
      });
      window.egoLite.onImportStatus((value) => {
        if (value?.state === "restarting") status.textContent = "restarting…";
      });
      window.egoLite.onBrowserState(applyState);
      window.egoLite.getBrowserState().then(applyState);
    </script>
  </body>
</html>
