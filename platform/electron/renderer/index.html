<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ego lite</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #e5e7eb;
        background: #111827;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
      }

      #toolbar {
        align-items: center;
        background: #111827;
        border-bottom: 1px solid #374151;
        display: flex;
        gap: 8px;
        height: 52px;
        padding: 8px 12px;
      }

      button {
        background: #1f2937;
        border: 1px solid #4b5563;
        border-radius: 6px;
        color: #e5e7eb;
        cursor: pointer;
        font-size: 16px;
        height: 34px;
        min-width: 34px;
      }

      button:hover {
        background: #374151;
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
      }

      form {
        display: flex;
        flex: 1;
        gap: 8px;
      }

      input {
        background: #1f2937;
        border: 1px solid #4b5563;
        border-radius: 6px;
        color: #f9fafb;
        flex: 1;
        font:
          14px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        height: 34px;
        min-width: 0;
        padding: 0 10px;
      }

      #status {
        color: #9ca3af;
        font-size: 12px;
        max-width: 240px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="back" type="button" title="Back">‹</button>
      <button id="forward" type="button" title="Forward">›</button>
      <button id="reload" type="button" title="Reload">↻</button>
      <form id="address-form">
        <input
          id="address"
          aria-label="Address"
          autocomplete="url"
          spellcheck="false"
          value="about:blank"
        />
      </form>
      <span id="status">ready</span>
    </div>
    <script>
      const address = document.querySelector("#address");
      const status = document.querySelector("#status");
      const back = document.querySelector("#back");
      const forward = document.querySelector("#forward");

      function applyState(state) {
        address.value = state.url || "about:blank";
        status.textContent = state.title || "ego lite";
        back.disabled = !state.canGoBack;
        forward.disabled = !state.canGoForward;
      }

      document
        .querySelector("#address-form")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          try {
            await window.egoLite.navigate(address.value);
          } catch (error) {
            status.textContent = error.message;
          }
        });
      back.addEventListener("click", () => window.egoLite.back());
      forward.addEventListener("click", () => window.egoLite.forward());
      document
        .querySelector("#reload")
        .addEventListener("click", () => window.egoLite.reload());
      window.egoLite.onBrowserState(applyState);
      window.egoLite.getBrowserState().then(applyState);
    </script>
  </body>
</html>
